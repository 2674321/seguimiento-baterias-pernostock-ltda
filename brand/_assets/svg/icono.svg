<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo transparente -->
  <defs>
    <linearGradient id="carga" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="bateria-clip">
      <rect x="22" y="32" width="84" height="62" rx="8"/>
    </clipPath>
    <linearGradient id="cuerpo-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo de la batería -->
  <rect x="22" y="32" width="84" height="62" rx="8" fill="url(#cuerpo-grad)" stroke="#1f2937" stroke-width="2"/>

  <!-- Terminales superiores -->
  <rect x="42" y="26" width="14" height="8" rx="2.5" fill="#6b7280"/>
  <rect x="72" y="26" width="14" height="8" rx="2.5" fill="#6b7280"/>

  <!-- Relleno de carga (60%) -->
  <g clip-path="url(#bateria-clip)">
    <rect x="26" y="36" width="50" height="54" rx="4" fill="url(#carga)" opacity="0.92"/>
  </g>

  <!-- Borde interior (sutileza) -->
  <rect x="22" y="32" width="84" height="62" rx="8" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Flecha circular de seguimiento (arco 270° con punta) -->
  <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(64,63)">
    <!-- Arco principal: de 30° hasta 300° (270° total) -->
    <path d="M 0,-38 A 38,38 0 1 1 -32.9,-19" fill="none" stroke="#f59e0b"/>
    <!-- Punta de flecha -->
    <polygon points="-36,-24 -28,-14 -28,-30" fill="#f59e0b"/>
  </g>

  <!-- Punto de energía dentro de la flecha -->
  <circle cx="64" cy="63" r="5" fill="#f59e0b" opacity="0.9"/>
</svg>